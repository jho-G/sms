      description: |-
        GET /api/academics/assignments/teacher/<uuid>/
        Get all assignments for a teacher (Director: any, Teacher: own only).
      summary: Get all assignments for a teacher
      parameters:
      - in: query
        name: academic_year_id
        schema:
          type: string
        description: Optional Academic Year UUID filter
      - in: path
        name: teacher_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academics
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
