openapi: 3.0.3
info:
  title: Student Management System (SMS) API
  version: 1.0.0
  description: Production-grade Modular Monolith REST API for Academic Management,
    Enrollment, Attendance Tracking, and Grading.
paths:
  /api/academics/assignments/:
    get:
      operationId: academics_assignments_list
      description: |-
        GET /api/academics/assignments/
        POST /api/academics/assignments/
        List subject assignments (Director: all, Teacher: own) or create one
        (Director only).
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - academics
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubjectAssignmentList'
          description: ''
    post:
      operationId: academics_assignments_create
      description: |-
        GET /api/academics/assignments/
        POST /api/academics/assignments/
        List subject assignments (Director: all, Teacher: own) or create one
        (Director only).
      tags:
      - academics
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectAssignmentCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubjectAssignmentCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubjectAssignmentCreateRequest'
        required: true
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectAssignmentCreate'
          description: ''
  /api/academics/assignments/{id}/:
    get:
      operationId: academics_assignments_retrieve
      description: |-
        GET/DELETE /api/academics/assignments/<uuid>/
        Retrieve (Director, or the assigned teacher) or deactivate (Director).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - academics
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectAssignment'
          description: ''
    delete:
      operationId: academics_assignments_destroy
      description: |-
        GET/DELETE /api/academics/assignments/<uuid>/
        Retrieve (Director, or the assigned teacher) or deactivate (Director).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - academics
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/academics/assignments/section/{section_id}/:
    get:
      operationId: academics_assignments_section_list
      description: |-
        GET /api/academics/assignments/section/<uuid>/
        Get all assignments for a section (Director: all, Teacher: own only).
      summary: Get all assignments for a class section
      parameters:
      - in: path
        name: section_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Academics
      security:
      - jwtAuth: []
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectAssignment'
          description: ''
