components:
  schemas:
    AcademicYear:
      type: object
      description: Serializer for AcademicYear model.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: e.g., 2024-2025
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
          description: Only one academic year can be active at a time
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - end_date
      - id
      - name
      - start_date
      - updated_at
    AcademicYearCreate:
      type: object
      description: Serializer for creating AcademicYear.
      properties:
        name:
          type: string
          description: e.g., 2024-2025
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
          description: Only one academic year can be active at a time
      required:
      - end_date
      - name
      - start_date
    AcademicYearCreateRequest:
      type: object
      description: Serializer for creating AcademicYear.
      properties:
        name:
          type: string
          minLength: 1
          description: e.g., 2024-2025
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
          description: Only one academic year can be active at a time
      required:
      - end_date
      - name
      - start_date
    AcademicYearRequest:
      type: object
      description: Serializer for AcademicYear model.
      properties:
        name:
          type: string
          minLength: 1
          description: e.g., 2024-2025
          maxLength: 20
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        is_active:
          type: boolean
          description: Only one academic year can be active at a time
      required:
      - end_date
      - name
      - start_date
    AssessmentCategory:
      type: object
      description: Read-only serializer for AssessmentCategory with nested info.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Category name, e.g., Midterm, Final Exam, Quizzes
          maxLength: 100
        subject_assignment:
          type: string
          format: uuid
        subject_name:
          type: string
          readOnly: true
        subject_code:
          type: string
          readOnly: true
        section:
          type: string
          format: uuid
          readOnly: true
