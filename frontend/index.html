<!DOCTYPE html>
<html lang="en" class="h-full bg-gray-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS - Student Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full">
    <div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
        <!-- Logo & Header -->
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="flex justify-center">
                <div class="w-16 h-16 bg-indigo-600 rounded-xl flex items-center justify-center">
                    <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                </div>
            </div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">Student Management System</h2>
            <p class="mt-2 text-center text-sm text-gray-600" id="form-subtitle">Sign in to your account</p>
        </div>

        <!-- Card Container -->
        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white py-8 px-4 shadow-xl rounded-xl sm:px-10 border border-gray-100">
                
                <!-- Tab Buttons -->
                <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
                    <button id="login-tab" onclick="switchTab('login')" 
                        class="flex-1 py-2 px-4 text-sm font-medium rounded-md bg-white text-indigo-600 shadow transition-all duration-200">
                        Login
                    </button>
                    <button id="register-tab" onclick="switchTab('register')" 
                        class="flex-1 py-2 px-4 text-sm font-medium rounded-md text-gray-500 hover:text-gray-700 transition-all duration-200">
                        Register
                    </button>
                </div>

                <!-- Error Message -->
                <div id="error-message" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>

                <!-- Success Message -->
                <div id="success-message" class="hidden mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm"></div>

                <!-- Login Form -->
                <form id="login-form" class="space-y-5">
                    <div>
                        <label for="login-email" class="block text-sm font-medium text-gray-700">Email address</label>
                        <input id="login-email" name="email" type="email" autocomplete="email" required
                            class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                    </div>
                    <div>
                        <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required
                            class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                    </div>
                    <div>
                        <button type="submit" id="login-btn"
                            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all">
                            Sign in
                        </button>
                    </div>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="hidden space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label for="reg-firstname" class="block text-sm font-medium text-gray-700">First name</label>
                            <input id="reg-firstname" name="first_name" type="text" required
                                class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                        </div>
                        <div>
                            <label for="reg-lastname" class="block text-sm font-medium text-gray-700">Last name</label>
                            <input id="reg-lastname" name="last_name" type="text" required
                                class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                        </div>
                    </div>
                    <div>
                        <label for="reg-username" class="block text-sm font-medium text-gray-700">Username</label>
                        <input id="reg-username" name="username" type="text" autocomplete="username" required
                            class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                    </div>
                    <div>
                        <label for="reg-email" class="block text-sm font-medium text-gray-700">Email address</label>
                        <input id="reg-email" name="email" type="email" autocomplete="email" required
                            class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                    </div>
                    <div>
                        <label for="reg-role" class="block text-sm font-medium text-gray-700">Role</label>
                        <select id="reg-role" name="role" required
                            class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                            <option value="STUDENT">Student</option>
                            <option value="TEACHER">Teacher</option>
                            <option value="PARENT">Parent</option>
                        </select>
                    </div>
                    <div>
                        <label for="reg-password" class="block text-sm font-medium text-gray-700">Password</label>
                        <input id="reg-password" name="password" type="password" autocomplete="new-password" required
                            class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                    </div>
                    <div>
                        <label for="reg-password-confirm" class="block text-sm font-medium text-gray-700">Confirm password</label>
                        <input id="reg-password-confirm" name="password_confirm" type="password" autocomplete="new-password" required
                            class="mt-1 appearance-none block w-full px-3 py-2 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                    </div>
                    <div>
                        <button type="submit" id="register-btn"
                            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all">
                            Create account
                        </button>
                    </div>
                </form>

                <!-- Demo Credentials -->
                <div class="mt-6">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-gray-300"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-white text-gray-500">Demo Credentials</span>
                        </div>
                    </div>
                    <div class="mt-4 grid grid-cols-2 gap-2 text-xs text-gray-600">
                        <div class="p-2 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100" onclick="fillDemo('director')">
                            <span class="font-semibold text-indigo-600">Director</span><br>
                            director@sms.com
                        </div>
                        <div class="p-2 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100" onclick="fillDemo('teacher')">
                            <span class="font-semibold text-green-600">Teacher</span><br>
                            teacher@sms.com
                        </div>
                        <div class="p-2 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100" onclick="fillDemo('student')">
                            <span class="font-semibold text-blue-600">Student</span><br>
                            student@sms.com
                        </div>
                        <div class="p-2 bg-gray-50 rounded-lg cursor-pointer hover:bg-gray-100" onclick="fillDemo('parent')">
                            <span class="font-semibold text-purple-600">Parent</span><br>
                            parent@sms.com
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
